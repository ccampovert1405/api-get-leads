name: CI Backend & Railway Deploy

on:
  pull_request:
    branches:
      - production
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Compilation
        run: npm run build

      - name: Verify Production Dockerfile Build
        run: |
          docker build \
            --tag meta-ads-api:${{ github.sha }} \
            --tag meta-ads-api:latest \
            .

  deploy-to-railway:
    name: Deploy to Railway (Production)
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy via Railway CLI (if RAILWAY_TOKEN is configured)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE_NAME }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "==> Token de Railway detectado. Desplegando servicio con Railway CLI..."
            npm install -g @railway/cli
            if [ -n "$RAILWAY_SERVICE" ]; then
              railway up --service "$RAILWAY_SERVICE" --detach
            else
              railway up --detach
            fi
            echo "==> Despliegue enviado a Railway exitosamente."
          else
            echo "==> RAILWAY_TOKEN no configurado en Secrets de GitHub."
            echo "==> Si conectaste el repositorio directamente en el dashboard de Railway,"
            echo "==> Railway ejecutará el build automáticamente al detectar este merge a 'production'."
          fi
